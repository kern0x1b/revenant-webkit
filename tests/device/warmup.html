<title>warm-up</title>
<p>The first page a freshly launched Safari loads does not have the tweak's
window-object hook in place yet, so the bridges it installs - WebAssembly among
them - are missing there and present from the second page on. The suite loads
this page first so that no measured page is ever that first page.</p>
