<!doctype html><meta charset=utf-8><title>two modes</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<body style="margin:0">
<div style="position:relative;width:300px;height:100px;background:rgb(224,160,32)">
  <div style="position:absolute;left:0;top:0;width:150px;height:100px;background:rgb(64,128,192);mix-blend-mode:multiply"></div>
  <div style="position:absolute;left:150px;top:0;width:150px;height:100px;background:rgb(64,128,192);mix-blend-mode:hue"></div>
</div>
