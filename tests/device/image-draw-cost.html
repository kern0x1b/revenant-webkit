<!doctype html><meta charset=utf-8><title>image-draw-cost</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<body style="font:13px sans-serif;padding:6px">
<script src="report.js"></script>
<script>
// What purgeable decoded images cost in CPU.
//
// Marking decoded bytes transient lets the kernel reclaim them, and skips the
// subimage cache, so a cropped draw recreates the image every time. That is the
// regression upstream cited when it rolled the same change out twice, so it is
// measured here rather than assumed: many cropped draws of one decoded image.
var image = new Image();
image.onload = function () {
    var canvas = document.createElement('canvas');
    canvas.width = 320; canvas.height = 240;
    var context = canvas.getContext('2d');

    // Warm up, so the first decode is not in the measurement.
    for (var w = 0; w < 20; w++)
        context.drawImage(image, 0, 0, 64, 64, 0, 0, 64, 64);

    var draws = 600, start = Date.now();
    for (var i = 0; i < draws; i++) {
        var sx = (i * 13) % 500, sy = (i * 7) % 350;
        context.drawImage(image, sx, sy, 120, 120, (i % 4) * 80, (i % 3) * 80, 80, 80);
    }
    var elapsed = Date.now() - start;
    report('cropped-draws-cost', true, draws + ' cropped draws in ' + elapsed + ' ms');
    reportDone();
};
image.onerror = function () { report('cropped-draws-cost', false, 'image did not load'); reportDone(); };
image.src = 'sample.jpg';
</script>
