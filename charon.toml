[port]
name = "revenant-webkit"
version = "0.1.0"
description = "WebKit for armv7 / iOS 6"
index = "revenant"
engine = "webkit-254"
licenses = ["LICENSE", "THIRD-PARTY.md"]

[target]
arch = "armv7"
os = "iOS"
os-version = "6.0"
sdk = "iphoneos"
cppstd = 23
cpu = "cortex-a9"
fpu = "neon"

[requires]
openssl = "3.0.15@revenant/stable"
brotli = "1.1.0@revenant/stable"
libwebp = "1.4.0@revenant/stable"
libxml2 = "2.15.4@revenant/stable"
libxslt = "1.1.45@revenant/stable"
libpsl = "0.23.3@revenant/stable"
icu = "74.2@revenant/stable"
woff2 = "1.0.2@revenant/stable"
libcxx = "21.1.0@ios6/stable"
wasm3 = "cci.20260905@revenant/stable"

[tools]
cmake = "4.4.3"
ninja = "1.13.2"
ldid = "2.1.5@ios6/stable"
ios6-imports-check = "1.0@ios6/stable"

[checks]
before-build = ["scripts/carry-check.py", "scripts/port-delta.py"]

[conf]
"user.ios6:llvm_prefix" = "a path to an LLVM, because cctools runs llvm-config to find libLTO when the ld64 package is built from source; export LLVM_PREFIX before the first build on a machine"

[variants.system]

[variants.prefixed]
options = ["prefixed=True"]
prefix-header = "ios6_class_prefix.h"
exports = "{build}/WebKitLegacy-iOS-rev.exp"

[variants.prefixed.engine-options]
ENABLE_MEDIA_STREAM = "OFF"
ENABLE_NOTIFICATIONS = "OFF"
ENABLE_WEBGL = "OFF"

[engine]
cmake = "webkit-254"
find-packages = ["icu", "libcxx", "libxml2", "libxslt", "openssl", "wasm3"]
user-toolchain = "scripts/ios6-armv7-trunk.cmake"
project-include = "scripts/ios6-conan-targets.cmake"
prefix-header = "ios6_class_names.h"
exports = "{source}/Source/WebKitLegacy/WebKitLegacy-iOS.exp"
stubs = "compat/stubs"

[flags]
common = "-flto=thin -mllvm -hot-cold-split=false -target {triple} {tuning} -isysroot {sdk}"
defines = "-DWEBKIT_IOS6=1 -DENABLE_UNFAIR_LOCK=0 -DWEBKIT_IOS6_NO_READLINE -DU_STATIC_IMPLEMENTATION"
cxx = "{common} -nostdinc++ -isystem {include:libcxx}/c++/v1 -isystem {stubs} -include {stubs}/ios6_dispatch_compat.h -include {stubs}/{prefix-header} -D_LIBCPP_DISABLE_AVAILABILITY {defines}"
c = "{common} -isystem {stubs} -include {stubs}/{prefix-header} {defines}"
objcxx = "{cxx} -DWEBKIT_IOS6_OBJC_EXTRAS"
objc = "{c} -DWEBKIT_IOS6_OBJC_EXTRAS"
shared-link = "-B{bin:ld64} -flto=thin -Wl,-compatibility_version,1.0.0 -Wl,-current_version,1.0.0 {libdirs:libxslt,woff2} {lib:brotli:brotlidec} {lib:brotli:brotlicommon} {lib:libpsl:psl}"
exe-link = "-B{bin:ld64} {lib:libpsl:psl} -Wl,-rpath,@executable_path/Frameworks"
module-link = "-B{bin:ld64} {lib:libpsl:psl}"

[engine.options]
PORT = "Cocoa"
DEVELOPER_MODE = "OFF"
SWIFT_REQUIRED = "OFF"
WEBKIT_IOS6_SIZE_OPTIMIZED = "ON"
WEBKIT_NO_AVAILABILITY_OVERLAY = "ON"
CMAKE_DISABLE_PRECOMPILE_HEADERS = "OFF"
WEBKIT_IOS6_CRYPTO_LIB = "{lib:openssl:crypto}"
WEBKIT_IOS6_COMPAT_LIB = "{target:ios6compat}"
WEBKIT_IOS6_EXPORTS = "{exports}"
WEBKIT_IOS6_LIBCXX_DIR = "{pkg:libcxx}"
USE_WEBP = "ON"
WebP_INCLUDE_DIR = "{include:libwebp}"
WebP_LIBRARY = "{lib:libwebp:webp}"
WebP_DEMUX_LIBRARY = "{lib:libwebp:webpdemux}"
USE_WOFF2 = "ON"
WOFF2_INCLUDE_DIR = "{include:woff2}"
WOFF2_DEC_INCLUDE_DIR = "{include:woff2}"
WOFF2_LIBRARY = "{lib:woff2:woff2common}"
WOFF2_DEC_LIBRARY = "{lib:woff2:woff2dec}"
ENABLE_WEBKIT_LEGACY = "ON"
ENABLE_WEBKIT = "OFF"
ENABLE_TOUCH_EVENTS = "ON"
ENABLE_IOS_TOUCH_EVENTS = "OFF"
ENABLE_WEBKIT_OVERFLOW_SCROLLING_CSS_PROPERTY = "ON"
ENABLE_NOTIFICATIONS = "ON"
ENABLE_FULLSCREEN_API = "ON"
ENABLE_XSLT = "ON"
ENABLE_WEBGL = "ON"
ENABLE_MEDIA_STREAM = "ON"
ENABLE_WIRELESS_PLAYBACK_TARGET = "ON"
ENABLE_WIRELESS_PLAYBACK_TARGET_AVAILABILITY_API = "ON"
ENABLE_JIT = "ON"
ENABLE_DFG_JIT = "ON"
ENABLE_C_LOOP = "OFF"
ENABLE_FTL_JIT = "OFF"
USE_SYSTEM_MALLOC = "ON"
ENABLE_WEBGPU = "OFF"
ENABLE_WEBDRIVER = "OFF"
ENABLE_WEBINSPECTORUI = "OFF"
ENABLE_API_TESTS = "OFF"
ENABLE_MINIBROWSER = "OFF"
ENABLE_WEB_RTC = "OFF"
USE_LIBWEBRTC = "OFF"
ENABLE_MEDIA_RECORDER = "OFF"
ENABLE_WEB_CODECS = "OFF"
ENABLE_COCOA_WEBM_PLAYER = "OFF"
ENABLE_AV1 = "OFF"
ENABLE_SPEECH_SYNTHESIS = "OFF"
ENABLE_WEB_SPEECH = "OFF"
ENABLE_GAMEPAD = "OFF"
ENABLE_PIXEL_FORMAT_RGBA16F = "OFF"
ENABLE_COMPRESSION_STREAM = "OFF"
ENABLE_APPLE_PAY = "OFF"
ENABLE_APPLE_PAY_COUPON_CODE = "OFF"
ENABLE_APPLE_PAY_SESSION_V3 = "OFF"
USE_ANGLE_EGL = "OFF"
ENABLE_MEDIA_SOURCE = "OFF"
ENABLE_MEDIA_SOURCE_IN_WORKERS = "OFF"
ENABLE_ENCRYPTED_MEDIA = "OFF"
ENABLE_LEGACY_ENCRYPTED_MEDIA = "OFF"
ENABLE_WEB_AUTHN = "OFF"
ENABLE_WRITING_TOOLS = "OFF"
ENABLE_PAYMENT_REQUEST = "OFF"
ENABLE_IMAGE_DIFF = "OFF"
BROWSERENGINECORE_LIBRARY = "BROWSERENGINECORE_LIBRARY-NOTFOUND"
BROWSERENGINEKIT_LIBRARY = "BROWSERENGINEKIT_LIBRARY-NOTFOUND"
UNIFORMTYPEIDENTIFIERS_LIBRARY = "UNIFORMTYPEIDENTIFIERS_LIBRARY-NOTFOUND"

[[static-library]]
name = "ios6compat"
cmake = "compat"
produces = "libios6compat.a"
options = { WEBKIT_IOS6_LIBCXX_DIR = "{pkg:libcxx}", LIBPSL_INCLUDE_DIR = "{include:libpsl}" }

[[device-library]]
name = "platform"
cmake = "platform"
installs-into = "stage"

[application]
name = "RevWebViewHost"
variant = "prefixed"
cmake = "app"
options = { ENGINE_BUILD = "{build}", CLASS_PREFIX_HEADER = "{stubs}/ios6_class_prefix.h" }
entitlements = "app/entitlements.xml"
log = "/tmp/rev-webview-host.log"
first-page = "/tmp/rev-url.txt"

[application.plist]
CFBundleIdentifier = "space.kern0x1b.revwebviewhost"
CFBundlePackageType = "APPL"
CFBundleSupportedPlatforms = ["iPhoneOS"]
UIDeviceFamily = [1]
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait"]
url-scheme = "revwebviewhost"

[stage]
engine-location = "usr/lib/rev-fw"

[stage.frameworks.JavaScriptCore]
as = "JavaScriptCore"
replaces = "/System/Library/PrivateFrameworks/JavaScriptCore.framework/JavaScriptCore"

[stage.frameworks.WebCore]
as = "WebCore"
replaces = "/System/Library/PrivateFrameworks/WebCore.framework/WebCore"
resources = true
omit = ["WebCore", "Headers", "PrivateHeaders", "Modules", "_CodeSignature"]
flatten = [{ from = "modern-media-controls/images/iOS", into = "modern-media-controls/images", patterns = ["*.svg", "*.png"] }]

[stage.frameworks.WebKitLegacy]
as = "WebKit"
replaces = "/System/Library/PrivateFrameworks/WebKit.framework/WebKit"

[stage.runtime]
"libc++.1.0.dylib" = "librev-c++.1.dylib"
"libc++abi.1.0.dylib" = "librev-c++abi.1.dylib"

[package]
control = "packaging/control"
maintainer-scripts = "packaging/DEBIAN"

[tasks]
carry-check = "scripts/carry-check.py"
port-delta = "scripts/port-delta.py"
compat-audit = "tools/compat-audit.py --compat {target:ios6compat} --engine-build {build} --icu {pkg:icu}"
symbol-check = "tools/symbol-check.py --build {build}"
prefix-exports = "tools/prefix-exports.py {stubs}/ios6_class_prefix.h {engine-exports} {exports}"

[pipeline]
system = [
    "task:carry-check",
    "build:ios6compat",
    "build:engine",
    "check:exports",
    "task:compat-audit",
    "task:symbol-check",
    "build:platform",
    "stage:frameworks",
    "stage:plists-to-binary",
    "check:no-encryption-info",
    "check:imports",
]
prefixed = [
    "task:carry-check",
    "task:prefix-exports",
    "build:ios6compat",
    "build:engine",
    "check:exports",
    "task:compat-audit",
    "build:application",
]

[tests]
transport = "tests/device/harness.py:bind"

[tests.scripts]
runs = ["tests/scripts/build-lookup.py", "tests/scripts/declaration-matches-recipe.py"]
needs = []

[tests.host]
runs = ["tests/run-tests.py:run_host_tests"]
needs = []

[tests.gate]
runs = ["tests/device/run.py:run_gate"]
needs = ["device"]

[tests.batteries]
runs = ["tests/run-tests.py:run_device_tests"]
needs = ["device", "build"]
